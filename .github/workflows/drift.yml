# Nightly: plan every configured stack and contract with -detailed-exitcode;
# open an issue per environment that drifted.
name: drift

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.m.outputs.envs }}
      contracts: ${{ steps.m.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: |
          envs=$(ls -d environments/*/ | xargs -n1 basename | while read -r e; do [ -f "environments/$e/backend.hcl" ] && echo "$e"; done)
          echo "envs=$(printf '%s\n' $envs | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          # env => space-separated contract names
          echo "contracts=$(for e in $envs; do printf '%s\t%s\n' "$e" "$(ls environments/$e/access-contracts/*.tfvars 2>/dev/null | xargs -rn1 basename | sed 's/.tfvars$//' | tr '\n' ' ')"; done | jq -Rsc 'split("\n") | map(select(. != "") | split("\t") | {(.[0]): (.[1] // "")}) | add // {}')" >> "$GITHUB_OUTPUT"

  drift:
    needs: detect
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.detect.outputs.envs) }}
    uses: ./.github/workflows/_stack.yml
    with:
      env: ${{ matrix.env }}
      command: drift
      stacks: identity network app-hosting platform gateway-config llm-backend-onboarding
      contracts: ${{ fromJSON(needs.detect.outputs.contracts)[matrix.env] }}
      runner: ${{ vars[format('RUNNER_{0}', matrix.env)] || '"ubuntu-latest"' }}
