# Nightly: plan every configured stack and contract with -detailed-exitcode;
# open an issue per environment that drifted.
name: drift

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.m.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        env:
          DEPLOYMENT_ENVIRONMENTS: ${{ vars.DEPLOYMENT_ENVIRONMENTS || '[]' }}
        run: |
          jq -e 'type == "array" and all(.[]; type == "string" and test("^[a-z0-9]{2,10}$"))' <<<"$DEPLOYMENT_ENVIRONMENTS" >/dev/null
          echo "envs=$(jq -c '.' <<<"$DEPLOYMENT_ENVIRONMENTS")" >> "$GITHUB_OUTPUT"

  drift:
    needs: detect
    if: needs.detect.outputs.envs != '[]'
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.detect.outputs.envs) }}
    uses: ./.github/workflows/_stack.yml
    with:
      env: ${{ matrix.env }}
      command: drift
      stacks: identity network app-hosting platform gateway-config llm-backend-onboarding
      contracts: "*"
      runner: ${{ vars[format('RUNNER_{0}', matrix.env)] || '"ubuntu-latest"' }}
